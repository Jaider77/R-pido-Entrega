user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # ============================================
    # UPSTREAM SERVICES
    # ============================================

    upstream auth_backend {
        least_conn;
        server auth-service:8000 max_fails=3 fail_timeout=30s;
    }

    upstream rutas_backend {
        least_conn;
        server rutas-service:8000 max_fails=3 fail_timeout=30s;
    }

    upstream notificaciones_backend {
        least_conn;
        server notificaciones-service:8000 max_fails=3 fail_timeout=30s;
    }

    upstream service3_backend {
        least_conn;
        server service3:8000 max_fails=3 fail_timeout=30s;
    }

    upstream frontend_backend {
        least_conn;
        server frontend:3000 max_fails=3 fail_timeout=30s;
    }

    # ============================================
    # MAIN SERVER
    # ============================================

    server {
        listen 80 default_server;
        server_name localhost;
        charset utf-8;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # CORS Headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
        add_header 'Access-Control-Max-Age' 1728000 always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ============================================
        # HEALTH CHECK
        # ============================================

        location /health {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "Nginx gateway is healthy\n";
        }

        # ============================================
        # API ROUTES
        # ============================================

        location /api/auth/ {
            proxy_pass http://auth_backend/api/auth/;
            include proxy_params;
        }

        location /api/rutas/ {
            proxy_pass http://rutas_backend/api/rutas/;
            include proxy_params;
        }

        location /api/notificaciones/ {
            proxy_pass http://notificaciones_backend/api/notificaciones/;
            include proxy_params;
        }

        location /api/service3/ {
            proxy_pass http://service3_backend/api/service3/;
            include proxy_params;
        }

        location /api/docs {
            proxy_pass http://auth_backend/docs;
            include proxy_params;
        }

        # ============================================
        # FRONTEND
        # ============================================

        location / {
            proxy_pass http://frontend_backend;
            include proxy_params;
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }
    }
}

# ============================================
# PROXY PARAMS (common settings)
# ============================================
# Crea un archivo separado en /etc/nginx/proxy_params con:
# proxy_http_version 1.1;
# proxy_set_header Upgrade $http_upgrade;
# proxy_set_header Connection "upgrade";
# proxy_set_header Host $host;
# proxy_set_header X-Real-IP $remote_addr;
# proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# proxy_set_header X-Forwarded-Proto $scheme;
# proxy_redirect off;
# proxy_connect_timeout 60s;
# proxy_send_timeout 60s;
# proxy_read_timeout 60s;
