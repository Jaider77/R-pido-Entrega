[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rapido-entrega"
version = "1.0.0"
description = "Plataforma logística de microservicios para Rápido-Entrega S.A."
readme = "README.MD"
authors = [
    { name = "Equipo Desarrollo", email = "dev@rapido-entrega.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["microservicios", "logistica", "fastapi", "docker"]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
    "httpx>=0.25",
    "aioredis>=2.0",
    "pika>=1.3",
    "python-multipart>=0.0.6",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "black>=23.12",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.5",
    "ipython>=8.18",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
]
prod = [
    "gunicorn>=21.2",
    "prometheus-client>=0.19",
]

# The services are separate FastAPI applications and are installed independently via their own requirements.txt files.
# Root packaging should not attempt to collect nested service app packages with duplicate package names.

# Configuración de pytest, black, ruff, mypy y coverage igual que la que ya definiste
