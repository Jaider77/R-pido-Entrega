name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Lint with Ruff
        run: ruff check services/ --fix

      - name: Format check with Black
        run: black --check services/ --line-length=100

      - name: Type check with MyPy
        run: mypy services/ --ignore-missing-imports

      - name: Security check with Bandit
        run: bandit -r services/ -ll

      - name: Run pytest
        run: |
          pytest services/ \
            --cov=services \
            --cov-report=xml \
            --cov-report=term \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push authentication service
        uses: docker/build-push-action@v4
        with:
          context: ./services/authentication
          file: ./services/authentication/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/rapido-auth:${{ github.sha }},
                 ${{ secrets.DOCKER_USERNAME }}/rapido-auth:latest

      - name: Build and push rutas service
        uses: docker/build-push-action@v4
        with:
          context: ./services/service1-rutas
          file: ./services/service1-rutas/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/rapido-rutas:${{ github.sha }},
                 ${{ secrets.DOCKER_USERNAME }}/rapido-rutas:latest

      - name: Build and push notificaciones service
        uses: docker/build-push-action@v4
        with:
          context: ./services/service2-notificaciones
          file: ./services/service2-notificaciones/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/rapido-notificaciones:${{ github.sha }},
                 ${{ secrets.DOCKER_USERNAME }}/rapido-notificaciones:latest

      - name: Build and push service3
        uses: docker/build-push-action@v4
        with:
          context: ./services/service3
          file: ./services/service3/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/rapido-service3:${{ github.sha }},
                 ${{ secrets.DOCKER_USERNAME }}/rapido-service3:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/rapido-frontend:${{ github.sha }},
                 ${{ secrets.DOCKER_USERNAME }}/rapido-frontend:latest

      - name: Build and push api-gateway
        uses: docker/build-push-action@v4
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/rapido-gateway:${{ github.sha }},
                 ${{ secrets.DOCKER_USERNAME }}/rapido-gateway:latest

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push'

    services:
      postgres-auth:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Run integration tests
        run: |
          echo "Running integration tests..."
          # Add your integration test commands here
        env:
          DATABASE_URL: postgresql://auth_user:auth_password@localhost:5432/auth_db
          REDIS_URL: redis://localhost:6379/0

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
