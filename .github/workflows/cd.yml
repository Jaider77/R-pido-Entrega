name: Deployment Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKER_USERNAME }}/rapido
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push authentication service
        uses: docker/build-push-action@v4
        with:
          context: ./services/authentication
          file: ./services/authentication/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/auth:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/rapido-auth:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push rutas service
        uses: docker/build-push-action@v4
        with:
          context: ./services/service1-rutas
          file: ./services/service1-rutas/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/rutas:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/rapido-rutas:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push notificaciones service
        uses: docker/build-push-action@v4
        with:
          context: ./services/service2-notificaciones
          file: ./services/service2-notificaciones/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/notificaciones:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/rapido-notificaciones:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push service3
        uses: docker/build-push-action@v4
        with:
          context: ./services/service3
          file: ./services/service3/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/service3:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/rapido-service3:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/rapido-frontend:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push api-gateway
        uses: docker/build-push-action@v4
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/gateway:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/rapido-gateway:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          echo "Deploying to Staging environment..."
          # Add your staging deployment commands here
          # Example: kubectl apply -f k8s/staging/
          # or: docker-compose -H ssh://staging-host up -d

      - name: Run smoke tests
        run: |
          echo "Running smoke tests on Staging..."
          # Add health check endpoints

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Deployment to Staging completed ✅",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Rápido-Entrega Staging Deployment*\n${{ github.ref_name }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://rapido-entrega.com

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "Deploying to Production environment..."
          # Add your production deployment commands here
          # Example: kubectl apply -f k8s/production/

      - name: Run health checks
        run: |
          echo "Running health checks on Production..."
          sleep 10
          for service in auth rutas notificaciones service3; do
            echo "Checking $service..."
            # curl https://api.rapido-entrega.com/api/$service/health || exit 1
          done

      - name: Create Release Notes
        id: release_notes
        run: |
          TAG=${{ github.ref_name }}
          echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Production Release ${{ github.ref_name }}
            Released: ${{ steps.release_notes.outputs.RELEASE_DATE }}

            ### Changes
            - Authentication Service
            - Rutas/Logística Service
            - Notificaciones Service
            - Generic Service3
            - Frontend React Application

            ### Docker Images
            - `${{ secrets.DOCKER_USERNAME }}/rapido-auth:${{ github.ref_name }}`
            - `${{ secrets.DOCKER_USERNAME }}/rapido-rutas:${{ github.ref_name }}`
            - `${{ secrets.DOCKER_USERNAME }}/rapido-notificaciones:${{ github.ref_name }}`
            - `${{ secrets.DOCKER_USERNAME }}/rapido-service3:${{ github.ref_name }}`
            - `${{ secrets.DOCKER_USERNAME }}/rapido-frontend:${{ github.ref_name }}`
            - `${{ secrets.DOCKER_USERNAME }}/rapido-gateway:${{ github.ref_name }}`
          draft: false
          prerelease: false

      - name: Notify Slack - Production
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "🚀 Production Deployment Completed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Rápido-Entrega Production Release*\n${{ github.ref_name }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status*\n✅ Success"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Environment*\nProduction"
                    }
                  ]
                }
              ]
            }

  rollback:
    runs-on: ubuntu-latest
    if: failure() && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Notify Rollback
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "⚠️ Deployment Failed - Rollback Required",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Rápido-Entrega Deployment Failed*\n${{ github.ref_name }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
